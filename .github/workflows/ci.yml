name: CMS CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      ADMIN_SESSION_SECRET: gamenexa-ci-session-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
